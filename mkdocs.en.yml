INHERIT: mkdocs.yml
site_name: Machine Learning in F1
site_description: Six Jupyter notebooks that go from raw Formula 1 data (FastF1) to lap-pace and podium models and an analysis of their errors.
site_url: https://f1.piotrkrzysztof.dev/en/
docs_dir: docs-en
site_dir: site/en
theme:
  language: en
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: red
      accent: red
      toggle:
        icon: material/brightness-7
        name: Dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: red
      accent: red
      toggle:
        icon: material/brightness-4
        name: Light mode

nav:
  - Introduction: index.md
  - First look at the data: 00-data-load.ipynb
  - Building the dataset: 01-build-dataset.ipynb
  - Exploratory data analysis: 02-eda.ipynb
  - "Regression: lap time": 03-regression-laptime.ipynb
  - "Classification: podium": 04-classification-podium.ipynb
  - Error analysis: 05-error-analysis.ipynb
  - About: about.md

extra:
  og_locale: en_US
  og_locale_alternate: pl_PL
  social:
    - icon: fontawesome/solid/globe
      link: https://piotrkrzysztof.dev
      name: piotrkrzysztof.dev
    - icon: fontawesome/brands/github
      link: https://github.com/straightchlorine/f1-ml-lab
      name: Source code on GitHub
  titles:
    00-data-load.ipynb: "A first look at the FastF1 data"
    01-build-dataset.ipynb: "Building the two F1 datasets"
    02-eda.ipynb: "Exploring the F1 data (EDA)"
    03-regression-laptime.ipynb: "Lap-time regression on F1 data"
    04-classification-podium.ipynb: "Podium classification in F1"
    05-error-analysis.ipynb: "Error analysis of the F1 models"
  descriptions:
    index.md: "Machine learning on Formula 1 data: from raw FastF1 data to lap-pace and podium models and an analysis of their errors, in six pre-executed Jupyter notebooks."
    00-data-load.ipynb: "A first look at the FastF1 API on the 2024 Italian Grand Prix: laps, weather, one driver's telemetry and a plot of lap time against tire age, with outliers."
    01-build-dataset.ipynb: "Building the 2023-2024 datasets: qualifying times from a separate session, a loop over races, lap cleaning and a driver-race table for podium classification."
    02-eda.ipynb: "Exploring the data: lap-time distribution, how much variance the track explains, tire degradation without the fuel effect, and grid position vs podium."
    03-regression-laptime.ipynb: "Lap-time regression: a failed first model on one season, adding a second season, relative pace as the target, a timed benchmark and a test with seven seasons."
    04-classification-podium.ipynb: "Podium classification from pre-race features: why accuracy misleads, data leakage, logistic regression, a classifier benchmark, class weights and calibration."
    05-error-analysis.ipynb: "Error analysis of both models: regression residuals, worst-predicted laps, the confusion matrix, probability calibration and podiums from far back on the grid."
    about.md: "About the project: authors, where the FastF1 data comes from, how to run the notebooks, how to read them (including deliberate model failures) and the license."
